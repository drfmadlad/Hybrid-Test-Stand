[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; FlexCAN_T4 library - install from GitHub
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git
    adafruit/Adafruit BMP3XX Library

; Build flags for optimization and debugging
build_flags = 
    -D USB_SERIAL
    -D ARDUINO_TEENSY41
    -O2

; Serial monitor configuration
monitor_speed = 2000000

; Upload configuration (automatic via Teensy Loader)
upload_protocol = teensy-cli

; Exclude archived source files from build
build_src_filter = +<*> -<combined_test_main.cpp> -<servo_test_main.cpp> -<slf3s_flow_test_main.cpp>


